name: Deploy Staging

on:
  push:
    branches:
      - develop

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}

    steps:
      - uses: actions/checkout@v3

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'enable-device/**'
            backend:
              - 'functions/backend/**'

  deploy:
    runs-on: ubuntu-latest
    needs: detect-changes

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate to Google Cloud (staging service account)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}

      # 🔥 FRONTEND (staging)
      - name: Deploy hosting
        if: needs.detect-changes.outputs.frontend == 'true'
        run: |
          cd enable-device
          npm install
          npm run build -- --mode staging
          cd ..
          firebase deploy --only hosting --project enableitalia-staging

      # 🔥 BACKEND (staging)
      - name: Deploy functions
        if: needs.detect-changes.outputs.backend == 'true'
        run: |
          cd functions/backend
          npm install
          npm run build --if-present
          cd ../..
          firebase deploy --only functions --project enableitalia-staging
