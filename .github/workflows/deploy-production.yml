name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      force_frontend:
        description: "Deploy frontend (hosting) to production"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      force_backend:
        description: "Deploy backend (functions) to production"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # 🔥 FRONTEND (production) — solo se esplicitamente richiesto
      - name: Deploy hosting
        if: github.event.inputs.force_frontend == 'true'
        run: |
          cd enable-device
          npm install
          npm run build
          cd ..
          firebase deploy --only hosting --token ${{ secrets.FIREBASE_TOKEN }}

      # 🔥 BACKEND (production) — solo se esplicitamente richiesto
      - name: Deploy functions
        if: github.event.inputs.force_backend == 'true'
        run: |
          cd functions/backend
          npm install
          npm run build --if-present
          cd ../..
          firebase deploy --only functions --token ${{ secrets.FIREBASE_TOKEN }}
